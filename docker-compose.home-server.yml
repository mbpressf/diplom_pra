services:
  finpotok-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    image: ${APP_NAME:-finpotok}-frontend-prod:latest
    container_name: ${APP_NAME:-finpotok}-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-finpotok}-frontend.rule=Host(`${APP_DOMAIN}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.${APP_NAME:-finpotok}-frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.docker.network=${DOCKER_NETWORK:-proxy}"
      - "traefik.http.services.${APP_NAME:-finpotok}-frontend.loadbalancer.server.port=80"
    networks:
      - proxy

  finpotok-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${APP_NAME:-finpotok}-backend-prod:latest
    container_name: ${APP_NAME:-finpotok}-backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/finance.db}
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-finpotok}-backend.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${APP_NAME:-finpotok}-backend.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.docker.network=${DOCKER_NETWORK:-proxy}"
      - "traefik.http.middlewares.${APP_NAME:-finpotok}-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.${APP_NAME:-finpotok}-backend.middlewares=${APP_NAME:-finpotok}-api-strip"
      - "traefik.http.services.${APP_NAME:-finpotok}-backend.loadbalancer.server.port=8000"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${DOCKER_NETWORK:-proxy}
